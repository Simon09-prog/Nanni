<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NANNI · Speisekarte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,450;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FEFBF5;
    --cream-2:#F3E9D6;
    --matcha:#5E7A3E;
    --matcha-dark:#33401F;
    --coffee:#3A2415;
    --coffee-warm:#6E4322;
    --ink:#221D17;
    --desc:#524A3E;
    --blush:#BD5B3C;
    --line: rgba(43,38,32,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:80px;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }
  button{ font: inherit; color: inherit; background:none; border:none; }

  /* ===== Blob signature shape ===== */
  .blob{ border-radius: 42% 58% 61% 39% / 47% 45% 55% 53%; }

  /* ===== Hero ===== */
  .hero{
    position:relative;
    padding: 56px 24px 90px;
    background: var(--matcha-dark);
    color: var(--cream);
    overflow:hidden;
    text-align:center;
    isolation:isolate;
  }
  .hero-video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0;
  }
  .hero-overlay{
    position:absolute; inset:0; z-index:1;
    background: linear-gradient(180deg, rgba(51,64,31,0.72) 0%, rgba(51,64,31,0.55) 45%, rgba(51,64,31,0.85) 100%);
  }
  .hero-eyebrow{ position:relative; z-index:2; font-size:12px; letter-spacing:0.28em; text-transform:uppercase; opacity:0.88; margin-bottom:18px; }
  .hero h1{ position:relative; z-index:2; font-family:'Fraunces', serif; font-optical-sizing:auto; font-weight:600; font-size: clamp(44px, 13vw, 64px); line-height:0.95; letter-spacing:-0.01em; }
  .hero p.tag{ position:relative; z-index:2; font-family:'Fraunces', serif; font-style:italic; font-weight:400; font-size:18px; margin-top:16px; opacity:0.96; }
  .hero .addr{ position:relative; z-index:2; margin-top:22px; font-size:13px; opacity:0.85; letter-spacing:0.02em; }

  /* ===== Sticky nav ===== */
  .navwrap{ position:sticky; top:0; z-index:20; background: rgba(251,243,231,0.94); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); }
  .nav{ display:flex; gap:8px; overflow-x:auto; padding: 12px 16px; scrollbar-width:none; }
  .nav::-webkit-scrollbar{ display:none; }
  .nav a{ flex:0 0 auto; font-size:13px; font-weight:700; text-decoration:none; color: var(--matcha-dark); background: var(--cream-2); padding:9px 16px; border-radius:999px; white-space:nowrap; letter-spacing:0.01em; transition: background .15s ease, color .15s ease; }
  .nav a:hover, .nav a:focus-visible{ background: var(--matcha); color: var(--cream); outline: none; }

  /* ===== Sections ===== */
  main{ max-width:640px; margin:0 auto; padding: 8px 20px 0; }
  section.cat{ padding: 46px 0 10px; scroll-margin-top: 64px; }
  .cat-head{ display:flex; align-items:baseline; gap:14px; margin-bottom: 6px; }
  .cat-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size: 30px; color: var(--coffee); letter-spacing:-0.01em; }
  .cat-sub{ font-family:'Fraunces', serif; font-style:italic; font-weight:300; font-size:14.5px; color: var(--coffee-warm); margin-bottom: 22px; }
  .divider{ width:34px; height:34px; background: var(--matcha); opacity:0.85; margin: 4px 0 20px; }

  /* ===== Category background photo sections ===== */
  .cat.has-photo{
    position:relative;
    color: var(--cream);
    border-radius: 28px;
    overflow:hidden;
    padding: 40px 22px 26px;
    margin: 30px 0;
    isolation:isolate;
  }
  .cat.has-photo .cat-bg{
    position:absolute; inset:0; z-index:-2;
    background-size:cover;
    background-position:center;
  }
  .cat.has-photo .cat-bg::after{ content:none; }
  .cat.has-photo::before{
    content:"";
    position:absolute; inset:0; z-index:-1;
    background: linear-gradient(180deg, rgba(51,64,31,0.62) 0%, rgba(51,64,31,0.86) 55%, rgba(51,64,31,0.94) 100%);
  }
  .cat.has-photo .cat-head h2{ color: var(--cream); }
  .cat.has-photo .cat-sub{ color: rgba(254,251,245,0.85); }
  .cat.has-photo .divider{ background: var(--cream); opacity:0.7; }
  .cat.has-photo .item{ border-bottom-color: rgba(254,251,245,0.22); }
  .cat.has-photo .item-name{ color: var(--cream); }
  .cat.has-photo .item-price{ color: var(--cream); }
  .cat.has-photo .item-desc{ color: rgba(254,251,245,0.82); }
  .cat.has-photo .item-arrow{ background: rgba(254,251,245,0.18); color: var(--cream); }
  .cat.has-photo .item[data-open="true"] .item-arrow{ background: rgba(254,251,245,0.9); color: var(--matcha-dark); }

  .items{ display:flex; flex-direction:column; }
  .item{ border-bottom: 1px solid var(--line); }
  .item:last-child{ border-bottom:none; }

  .item-toggle{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    padding: 14px 2px;
    cursor:pointer;
    text-align:left;
  }
  .item-name{ font-size:16.5px; font-weight:700; color: var(--ink); line-height:1.3; }
  .item-right{ display:flex; align-items:center; gap:12px; flex:0 0 auto; }
  .item-price{ font-weight:800; font-size:15.5px; color: var(--matcha-dark); white-space:nowrap; }
  .item-arrow{
    width:22px; height:22px;
    flex:0 0 auto;
    border-radius:50%;
    background: var(--cream-2);
    color: var(--matcha-dark);
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s ease, background .2s ease, color .2s ease;
  }
  .item-arrow svg{ width:11px; height:11px; transition: transform .25s ease; }
  .item[data-open="true"] .item-arrow{ background: var(--matcha); transform: rotate(180deg); }
  .item[data-open="true"] .item-arrow svg path{ stroke: var(--cream); }

  .item-panel{
    max-height:0;
    overflow:hidden;
    transition: max-height .28s ease;
  }
  .item-panel-inner{
    padding: 0 2px 16px;
  }
  .item-desc{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:400;
    font-size:14px;
    color: var(--desc);
    line-height:1.5;
  }

  .badge{ display:inline-block; font-size:10px; font-weight:800; letter-spacing:0.05em; text-transform:uppercase; background: var(--blush); color: white; padding:2px 8px; border-radius:999px; margin-left:8px; vertical-align:middle; position:relative; top:-1px; }

  /* ===== Signature callout (Shokupan) ===== */
  .signature{
    margin: 54px 0 10px;
    position:relative;
    overflow:hidden;
    color: var(--cream);
    border-radius: 42% 58% 61% 39% / 47% 45% 55% 53%;
    padding: 54px 34px;
    text-align:center;
    isolation:isolate;
  }
  .signature-bg{ position:absolute; inset:0; z-index:0; }
  .signature-bg img{ width:100%; height:100%; object-fit:cover; }
  .signature-bg::after{ content:""; position:absolute; inset:0; background: linear-gradient(180deg, rgba(58,36,21,0.82) 0%, rgba(58,36,21,0.9) 100%); }
  .signature h3, .signature p{ position:relative; z-index:1; }
  .signature h3{ font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size: 26px; margin-bottom:10px; }
  .signature p{ font-size:13.5px; opacity:0.85; max-width:320px; margin:0 auto; line-height:1.55; }

  footer{ text-align:center; padding: 60px 24px 20px; font-size:12px; color:#8a8072; }
  footer .fname{ font-family:'Fraunces', serif; font-style:italic; font-size:15px; color: var(--coffee); margin-bottom:6px; }
</style>
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>
</head>
<body>

<div class="hero">
  <video class="hero-video" autoplay muted loop playsinline preload="auto">
    <source src="nanni-hero.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>
  <div class="hero-eyebrow" id="hero-eyebrow"></div>
  <h1 id="hero-title"></h1>
  <p class="tag" id="hero-tag"></p>
  <div class="addr" id="hero-hours"></div>
</div>

<div class="navwrap">
  <nav class="nav" id="nav"></nav>
</div>

<main id="main"></main>

<footer>
  <div class="fname">NANNI Coffee &amp; Bar</div>
  Redlingerstraße 11 · 49074 Osnabrück<br>
  Prototyp erstellt von Tapvio
</footer>

<script>
const ARROW_SVG = '<span class="item-arrow"><svg viewBox="0 0 12 8" fill="none"><path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

function esc(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderItem(it){
  const badge = it.badge ? `<span class="badge">${esc(it.badge)}</span>` : '';
  const desc = it.description ? `<p class="item-desc">${esc(it.description)}</p>` : '';
  return `
      <div class="item" data-open="false">
        <button class="item-toggle">
          <span class="item-name">${esc(it.name)}${badge}</span>
          <span class="item-right">
            <span class="item-price">${esc(it.price)}</span>
            ${ARROW_SVG}
          </span>
        </button>
        <div class="item-panel"><div class="item-panel-inner">${desc}</div></div>
      </div>`;
}

function renderCategory(cat){
  const hasPhoto = !!cat.photo;
  const bg = hasPhoto ? `<div class="cat-bg" style="background-image:url('${esc(cat.photo)}')"></div>` : '';
  const sub = cat.subtitle ? `<p class="cat-sub">${esc(cat.subtitle)}</p>` : '';
  const divider = hasPhoto ? '' : '<div class="divider blob"></div>';
  const items = (cat.items || []).map(renderItem).join('');
  return `
  <section class="cat${hasPhoto ? ' has-photo' : ''}" id="${esc(cat.id)}">
    ${bg}
    <div class="cat-head"><h2>${esc(cat.title)}</h2></div>
    ${sub}
    ${divider}
    <div class="items">${items}</div>
  </section>`;
}

function renderSignature(sig){
  if(!sig) return '';
  return `
  <div class="signature blob">
    ${sig.photo ? `<div class="signature-bg"><img src="${esc(sig.photo)}" alt=""></div>` : ''}
    <h3>${esc(sig.title)}</h3>
    <p>${esc(sig.text)}</p>
  </div>`;
}

fetch('data/menu.json')
  .then(r => r.json())
  .then(data => {
    document.getElementById('hero-eyebrow').textContent = data.hero.eyebrow;
    document.getElementById('hero-title').textContent = data.hero.title;
    document.getElementById('hero-tag').textContent = data.hero.tagline;
    document.getElementById('hero-hours').textContent = data.hero.hours;

    const nav = document.getElementById('nav');
    nav.innerHTML = data.categories.map(c => `<a href="#${esc(c.id)}">${esc(c.title.split(',')[0])}</a>`).join('');

    const main = document.getElementById('main');
    let html = '';
    data.categories.forEach(cat => {
      html += renderCategory(cat);
      if(cat.id === 'shokupan' && data.signature){
        html = html; // signature inserted before this section below
      }
    });

    // Insert signature block right before the shokupan section
    const shokupanIndex = data.categories.findIndex(c => c.id === 'shokupan');
    let htmlParts = [];
    data.categories.forEach((cat, i) => {
      if(i === shokupanIndex && data.signature){
        htmlParts.push(renderSignature(data.signature));
      }
      htmlParts.push(renderCategory(cat));
    });
    main.innerHTML = htmlParts.join('');

    // Wire up accordion behavior
    document.querySelectorAll('.item-toggle').forEach(function(btn){
      btn.addEventListener('click', function(){
        var item = btn.closest('.item');
        var panel = item.querySelector('.item-panel');
        var isOpen = item.getAttribute('data-open') === 'true';
        if(isOpen){
          panel.style.maxHeight = null;
          item.setAttribute('data-open','false');
        } else {
          item.setAttribute('data-open','true');
          panel.style.maxHeight = panel.scrollHeight + 'px';
        }
      });
    });
  })
  .catch(err => {
    document.getElementById('main').innerHTML = '<p style="padding:40px;text-align:center;">Menü konnte nicht geladen werden.</p>';
    console.error(err);
  });
</script>

</body>
</html>
